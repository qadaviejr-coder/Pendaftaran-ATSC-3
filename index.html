<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHPro – Event Organizer &amp; Manajemen Kejuaraan Pencak Silat</title>
<meta name="description" content="Daftarkan atlet pencak silat ke kejuaraan secara online: pilih kejuaraan, isi data kontingen, unggah berkas, dan bayar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F3F4; --surface:#FFFFFF; --surface-2:#E9E9EC; --ink:#14141A; --muted:#575762; --line:#D3D3D9;
  --gold:#F2B600; --gold-text:#8A6400; --red:#C8101A; --black:#0D0D10; --focus:#0B5FFF;
  --ok:#14693A; --ok-bg:#DDF3E4; --warn:#7A4B00; --warn-bg:#FFEFC9; --bad:#A30F18; --bad-bg:#FBDADC;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D10; --surface:#17171D; --surface-2:#22222A; --ink:#F2F2F4; --muted:#A5A5B1; --line:#2D2D37;
    --gold-text:#FFC31F; --focus:#7FB0FF;
    --ok:#6FD79A; --ok-bg:#14301F; --warn:#F5C566; --warn-bg:#3A2B0A; --bad:#FF8A90; --bad-bg:#3B1417;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D10; --surface:#17171D; --surface-2:#22222A; --ink:#F2F2F4; --muted:#A5A5B1; --line:#2D2D37;
  --gold-text:#FFC31F; --focus:#7FB0FF;
  --ok:#6FD79A; --ok-bg:#14301F; --warn:#F5C566; --warn-bg:#3A2B0A; --bad:#FF8A90; --bad-bg:#3B1417;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-style:italic;font-weight:700;line-height:1.08;margin:0 0 .5em;letter-spacing:.005em}
h1{font-size:clamp(2.5rem,6.2vw,4.6rem);font-weight:800}
h2{font-size:clamp(1.9rem,3.6vw,2.7rem)}
h3{font-size:1.5rem}
p{margin:0 0 1em;max-width:68ch}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:1.25rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--gold);color:#000;padding:.6rem 1rem;z-index:100;font-weight:600}
.skip:focus{top:.5rem}
main{outline:none;min-height:60vh}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Header (always dark, echoes the logo shield) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--black);color:#F4F4F6;border-bottom:3px solid var(--gold)}
.bar{display:flex;align-items:center;gap:1rem;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;margin-right:auto;padding:.3rem 0}
.brand img{height:50px;width:auto;display:block}
.brand .wm{font:italic 800 1.5rem/1 var(--display);letter-spacing:.02em;color:#FFC31F}
.brand .wm small{display:block;font:500 .72rem/1.2 var(--body);font-style:normal;color:#B9B9C3;letter-spacing:0;margin-top:.15rem}
.navwrap{display:flex;align-items:center;gap:1.4rem}
.top nav{display:flex;gap:.2rem}
.top nav a{display:block;padding:.55rem .85rem;text-decoration:none;font:italic 700 1.2rem/1 var(--display);color:#D9D9E0;border-bottom:3px solid transparent}
.top nav a:hover{color:#fff}
.top nav a[aria-current="page"]{color:#FFC31F;border-bottom-color:var(--red)}
.acct{display:flex;align-items:center;gap:.8rem;font-size:.95rem}
.acct .who{color:#B9B9C3;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;padding:.3rem .2rem;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.menu-btn{display:none;background:none;border:2px solid #FFC31F;color:#FFC31F;font:italic 700 1.1rem var(--display);padding:.4rem .9rem;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  .navwrap{display:none;width:100%;flex-direction:column;align-items:stretch;gap:.5rem;padding:.5rem 0 1rem}
  .top.open .navwrap{display:flex}
  .top nav{flex-direction:column}
  .brand .wm small{display:none}
}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;display:inline-block;transform:skewX(-10deg);padding:.72rem 1.45rem;
  font:italic 700 1.1rem/1 var(--display);letter-spacing:.02em;text-decoration:none;
  background:linear-gradient(180deg,#FFD54D,#F2B600);color:#16120A;box-shadow:0 3px 0 #8F6A00;margin:0 .3rem}
.btn>span{display:inline-block;transform:skewX(10deg)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:skewX(-10deg) translateY(2px);box-shadow:0 1px 0 #8F6A00}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px currentColor}
.btn.dark{background:var(--black);color:#FFC31F;box-shadow:0 3px 0 #000}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #6E0910}
.btn.sm{padding:.5rem 1.05rem;font-size:1rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.top .btn.ghost,.hero .btn.ghost{color:#fff}
.cta-row{display:flex;flex-wrap:wrap;gap:.9rem .6rem;align-items:center}

/* Hero */
.hero{position:relative;isolation:isolate;background:var(--black);color:#F4F4F6;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1;
  background:
   linear-gradient(112deg,transparent 0 55%,rgba(200,16,26,.95) 55% 58.5%,transparent 58.5% 60%,rgba(242,182,0,.95) 60% 60.8%,transparent 60.8%),
   radial-gradient(55% 75% at 82% 45%,rgba(242,182,0,.16),transparent 70%),
   url("data:image/svg+xml,%3Csvg width='28' height='49' viewBox='0 0 28 49' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z' fill='%23ffffff' fill-opacity='.045'/%3E%3C/svg%3E");}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;padding-block:4rem 4.5rem}
.hero h1{color:#fff;max-width:14ch;margin-bottom:.45em}
.hero .lead{font-size:1.2rem;color:#D3D3DB;max-width:46ch;margin-bottom:1.6rem}
.hero-logo{display:flex;justify-content:center}
.hero-logo img{width:min(520px,100%);filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.countdown{margin:1.8rem 0 0;padding:.7rem 1rem;border-left:4px solid var(--gold);background:rgba(255,255,255,.06);color:#EDEDF1;font-size:1rem;max-width:44ch}
.countdown strong{color:#FFC31F;font-weight:600}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;padding-block:2.5rem 3rem}
  .hero-logo{order:-1}
  .hero-logo img{width:min(300px,70%)}
  .hero-bg{background:
   linear-gradient(112deg,transparent 0 80%,rgba(200,16,26,.95) 80% 83%,transparent 83% 84.5%,rgba(242,182,0,.95) 84.5% 85.3%,transparent 85.3%),
   radial-gradient(70% 50% at 50% 15%,rgba(242,182,0,.18),transparent 70%)}
}

/* Sections */
.sec{padding-block:4.2rem}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.sec-head h2{margin:0}
.page-head{background:var(--surface);border-bottom:1px solid var(--line);padding-block:2.8rem 2rem}
.page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.3em}
.page-head p{margin:0;color:var(--muted)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.4rem}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);padding:1.25rem 1.4rem;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.champ{display:flex;flex-direction:column;gap:.35rem}
.champ h3{margin:.3rem 0 .1rem;font-size:1.65rem}
.champ .meta{margin:0;color:var(--muted)}
.champ-top{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem;margin:.7rem 0}
.facts dt{font-size:.88rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .8rem}
.tag{padding:.1rem .6rem;border:1px solid var(--line);font-size:.9rem;background:var(--bg)}
.champ .cta-row{margin-top:auto;padding-top:.4rem}
.badge{display:inline-block;padding:.12rem .8rem;font:600 .88rem/1.5 var(--body);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.b-buka,.b-terverifikasi{background:var(--ok-bg);color:var(--ok)}
.b-tutup,.b-menunggu_verifikasi{background:var(--warn-bg);color:var(--warn)}
.b-selesai,.b-draft{background:var(--surface-2);color:var(--muted)}
.b-ditolak{background:var(--bad-bg);color:var(--bad)}

/* Steps / lists */
.steps{list-style:none;counter-reset:st;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem}
.steps li{counter-increment:st;position:relative;padding-top:3.4rem}
.steps li::before{content:counter(st);position:absolute;top:0;left:0;width:2.7rem;height:2.7rem;display:grid;place-items:center;
  background:var(--gold);color:#16120A;font:italic 800 1.6rem var(--display);transform:skewX(-10deg)}
.steps li::after{content:"";position:absolute;top:1.3rem;left:3.4rem;right:-1rem;height:3px;background:linear-gradient(90deg,var(--red),transparent)}
.steps li:last-child::after{display:none}
.steps h3{font-size:1.4rem;margin-bottom:.25em}
.steps p{color:var(--muted);margin:0;font-size:1rem}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}.steps li::after{display:none}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1fr 1.2fr;gap:3rem;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:1.5rem}}
.rules{list-style:none;margin:0;padding:0}
.rules li{padding:1rem 0;border-top:1px solid var(--line);display:grid;gap:.15rem}
.rules li:last-child{border-bottom:1px solid var(--line)}
.rules strong{font:italic 700 1.35rem var(--display)}
.rules span{color:var(--muted)}
.band{background:var(--gold);color:#16120A;padding-block:3rem}
.band .wrap{display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap}
.band h2{margin:0;max-width:22ch;font-size:clamp(1.8rem,3.4vw,2.5rem)}

/* Forms */
.field{margin-bottom:1rem}
.field label,.field legend{display:block;font-weight:600;margin-bottom:.3rem;padding:0}
fieldset.field{border:0;margin:0 0 1rem;padding:0;min-width:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid #8C8C98;padding:.62rem .75rem;border-radius:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--red)}
input[type=file]{padding:.45rem;border-style:dashed}
textarea{min-height:5.5rem;resize:vertical}
.hint{font-size:.9rem;color:var(--muted);margin:.3rem 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2rem}
.grid2 .span2{grid-column:1/-1}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.choices{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem}
.choices label{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:0}
.errbox{background:var(--bad-bg);color:var(--bad);border-left:5px solid var(--bad);padding:.8rem 1rem;margin-bottom:1rem}
.errbox ul{margin:.3rem 0 0;padding-left:1.1rem}
.note{background:var(--warn-bg);color:var(--warn);border-left:5px solid var(--gold);padding:.8rem 1rem;margin:0 0 1.2rem;max-width:none}
.okbox{background:var(--ok-bg);color:var(--ok);border-left:5px solid var(--ok);padding:.8rem 1rem;margin:0 0 1.2rem;max-width:none}
.panel{background:var(--surface);border:1px solid var(--line);padding:1.5rem}
.narrow{max-width:520px;margin-inline:auto}

/* Detail */
.detail{display:grid;grid-template-columns:1fr 340px;gap:2.5rem;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.9rem;background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.checklist{padding-left:1.2rem;margin:0 0 1.2rem}
.checklist li{margin-bottom:.3rem}
.seg{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 0}
.seg button{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:.45rem 1rem;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--black);color:#FFC31F;border-color:var(--black)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{border-color:var(--gold)}
.search{max-width:360px;margin-top:1rem}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted);border:2px dashed var(--line);grid-column:1/-1}

/* Wizard */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;list-style:none;padding:0;margin:0 0 1.8rem;counter-reset:s}
.stepper li{counter-increment:s;padding:.55rem .5rem;border-bottom:4px solid var(--line);font:italic 700 1.15rem/1.2 var(--display);color:var(--muted)}
.stepper li::before{content:counter(s) ". "}
.stepper li.done{border-color:var(--ok);color:var(--ink)}
.stepper li[aria-current="step"]{border-color:var(--gold);color:var(--ink)}
@media (max-width:560px){.stepper li{font-size:.95rem}}
.athletes{list-style:none;margin:0 0 1.2rem;padding:0;display:grid;gap:.8rem}
.athlete{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);padding:.9rem 1.1rem;display:flex;gap:1rem;justify-content:space-between;align-items:center;flex-wrap:wrap}
.athlete.ok{border-left-color:var(--ok)}
.athlete.warn{border-left-color:var(--gold)}
.athlete strong{font:italic 700 1.3rem var(--display)}
.athlete .sub{color:var(--muted);font-size:.95rem}
.row-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.total{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-top:2px solid var(--ink);font:italic 700 1.5rem var(--display)}
.wiz-nav{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:1.5rem}
.paybox{border:1.5px solid var(--line);padding:.9rem 1rem;margin-bottom:.7rem;background:var(--bg)}
.paybox.sel{border-color:var(--gold);background:var(--surface)}
.paybox label{display:flex;gap:.6rem;font-weight:600;margin:0}
.paybox p{margin:.3rem 0 0 1.7rem;color:var(--muted)}

/* Admin */
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:3px solid var(--line);margin-bottom:1.6rem}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-3px;padding:.6rem 1.1rem;font:italic 700 1.25rem var(--display);color:var(--muted);cursor:pointer}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);padding:1rem 1.1rem}
.stat b{display:block;font:italic 800 2.2rem/1.1 var(--display)}
.stat span{color:var(--muted);font-size:.95rem}
.toolbar{display:flex;gap:.8rem 1rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.toolbar .field{margin:0;min-width:200px}
.inline-fee{display:grid;grid-template-columns:1fr 150px;gap:.8rem;align-items:center;margin-bottom:.4rem}
.inline-fee label{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:0}

/* Dialog & toast */
dialog{border:0;border-top:5px solid var(--gold);padding:0;width:min(720px,94vw);max-height:90vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.62)}
.dlg-in{padding:1.5rem 1.6rem 1.7rem;overflow:auto;max-height:calc(90vh - 5px)}
.dlg-in h2{font-size:2rem}
.dlg-actions{display:flex;justify-content:flex-end;gap:.8rem;margin-top:1.3rem;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:200;display:grid;gap:.5rem;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--black);color:#fff;padding:.8rem 1.1rem;border-left:5px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.err{border-left-color:#FF5A63}

/* Footer */
.foot{background:var(--black);color:#C9C9D2;margin-top:0;border-top:3px solid var(--gold);padding-block:2.6rem 2rem}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:2rem}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr}}
.foot img{height:84px;width:auto}
.foot h4{font-size:1.2rem;color:#FFC31F;margin-bottom:.4rem}
.foot ul{list-style:none;margin:0;padding:0}
.foot li{margin-bottom:.3rem}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.copy{margin-top:1.8rem;padding-top:1rem;border-top:1px solid #2D2D37;font-size:.9rem;color:#8E8E9A}

details.kelasgrp{border:1px solid var(--line);margin-bottom:.6rem;padding:.6rem .9rem .3rem;background:var(--bg)}
details.kelasgrp summary{font:italic 700 1.2rem var(--display);cursor:pointer;margin-bottom:.5rem}
details.kelasgrp textarea{min-height:9rem;font-size:.95rem}
/* Bagan & kartu */
.bracket{display:flex;gap:1.6rem;overflow-x:auto;padding:.5rem 0 1rem;align-items:stretch}
.round{display:flex;flex-direction:column;min-width:200px}
.round h4{font-size:1.15rem;margin:0 0 .5rem;color:var(--muted)}
.rm{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:.8rem}
.match{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--gold);font-size:.95rem}
.match>div{padding:.35rem .6rem;border-bottom:1px solid var(--line)}
.match>div:last-child{border-bottom:0}
.match .no{font-size:.82rem;color:var(--muted);background:var(--surface-2)}
.match .bye{color:var(--muted);font-style:italic}
.match small{display:block;color:var(--muted)}
.kartu{border:2px solid var(--ink);border-left:8px solid var(--gold);padding:1rem 1.2rem}
.kartu .kode{font:italic 800 2rem/1.1 var(--display);color:var(--gold-text);margin:.2rem 0 .8rem}
@media print{
  body *{visibility:hidden}
  #dlg,#dlg *{visibility:visible}
  dialog{position:fixed;inset:0;margin:0;width:100%!important;max-height:none;border:0}
  .dlg-in{max-height:none;overflow:visible}
  .no-print{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Contoh bawaan saja. Panitia menetapkan kelas sebenarnya per kejuaraan di panel admin. */
function mk(start,step,n){var o=[];for(var i=0;i<n;i++)o.push([String.fromCharCode(65+i),start+i*step,start+(i+1)*step]);return o}
var KELAS_DEFAULT = {
  'Pra Usia Dini 1': mk(14,2,5),
  'Pra Usia Dini 2': mk(16,2,6),
  'Usia Dini 1': mk(20,3,6),
  'Usia Dini 2': mk(25,3,6),
  'Pra Remaja': mk(30,3,7),
  'Remaja': mk(45,5,10),
  'Dewasa': mk(45,5,10),
  'Master': mk(45,5,8)
};
function defaultKelas(list){
  var o={};
  list.forEach(function(u){
    var l=(KELAS_DEFAULT[u]||[]).map(function(k){return {n:k[0],a:k[1],b:k[2]}});
    o[u]={Putra:JSON.parse(JSON.stringify(l)),Putri:JSON.parse(JSON.stringify(l))};
  });
  return o;
}
function normalize(d){
  d.bagan=d.bagan||{};d.regs=d.regs||[];
  var mp={'Usia Dini':'Usia Dini 1'};
  d.champs.forEach(function(c){
    c.kelompokUsia=c.kelompokUsia.map(function(u){return mp[u]||u});
    if(!c.kelas||!Object.keys(c.kelas).length)c.kelas=defaultKelas(c.kelompokUsia);
  });
  d.regs.forEach(function(r){r.atlet.forEach(function(a){a.usia=mp[a.usia]||a.usia})});
  return d;
}

/* ============ UTIL ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(p){
  try{
    var b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
    var h=Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }catch(e){return p+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
}
function isoDay(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return isoDay(d)}
function pd(s){return new Date(s+'T00:00:00')}
function fmtD(s){return s?pd(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-'}
function fmtRange(a,b){
  if(!b||a===b) return fmtD(a);
  var A=pd(a),B=pd(b);
  if(A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear()) return A.getDate()+'–'+fmtD(b);
  return fmtD(a)+' – '+fmtD(b);
}
function rp(n){return 'Rp\u00a0'+Number(n||0).toLocaleString('id-ID')}
function ageAt(birth,ref){
  var b=pd(birth),r=pd(ref),a=r.getFullYear()-b.getFullYear(),m=r.getMonth()-b.getMonth();
  if(m<0||(m===0&&r.getDate()<b.getDate())) a--; return a;
}
function size(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function btn(label,attrs,cls){return '<button type="button" class="btn '+(cls||'')+'" '+(attrs||'')+'><span>'+label+'</span></button>'}
function lnk(label,href,cls,extra){return '<a class="btn '+(cls||'')+'" href="'+href+'" '+(extra||'')+'><span>'+label+'</span></a>'}
function toast(msg,err){
  var t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(function(){t.remove()},4200);
}

function subtotal(c,r){return r.atlet.reduce(function(s,a){return s+(c.fees[a.kategori]||0)},0)}

function berkasDone(c,a){return c.berkas.filter(function(b){return a.berkas&&a.berkas[b]}).length}
function allBerkas(c,r){return r.atlet.every(function(a){return berkasDone(c,a)===c.berkas.length})}
function kelasRange(k){return k.b==null?'di atas '+k.a+' kg':k.a+'–'+k.b+' kg'}
function kelasLabel(k){return (/^(kelas|open)\b/i.test(k.n)?k.n:'Kelas '+k.n)+' ('+kelasRange(k)+')'}
function kelasOptions(c,usia,jk){var l=(c.kelas&&c.kelas[usia]&&c.kelas[usia][jk])||[];return l.map(function(k){return {v:kelasLabel(k),a:k.a,b:k.b}})}
function classesToText(l){return (l||[]).map(function(k){return k.n+' | '+k.a+' | '+(k.b==null?'':k.b)}).join('\n')}
function parseKelas(text){
  var list=[],errs=[],seen={};
  text.split('\n').forEach(function(line,i){
    line=line.trim();if(!line)return;
    var p=line.split('|').map(function(x){return x.trim()}),n=p[0];
    var a=parseFloat((p[1]||'').replace(',','.')),b=(p[2]||'')===''?null:parseFloat(p[2].replace(',','.'));
    var tag='baris '+(i+1);
    if(!n)errs.push(tag+': nama kelas kosong.');
    else if(isNaN(a)||a<0)errs.push(tag+' ("'+n+'"): berat minimal harus berupa angka.');
    else if(b!==null&&(isNaN(b)||b<=a))errs.push(tag+' ("'+n+'"): berat maksimal harus lebih besar dari minimal.');
    else if(seen[n.toLowerCase()])errs.push(tag+': nama kelas "'+n+'" dobel.');
    else{seen[n.toLowerCase()]=1;list.push({n:n,a:a,b:b})}
  });
  list.sort(function(x,y){return x.a-y.a});
  return {list:list,errs:errs};
}

function athRow(a,rid){return {id:a.id,registration_id:rid,nama:a.nama,jk:a.jk,tgl_lahir:a.tglLahir,bb:a.bb,sekolah:a.sekolah,kategori:a.kategori,usia:a.usia,kelas:a.kelas,anggota:a.anggota||'',berkas:a.berkas||{}}}
function athFrom(a){return {id:a.id,nama:a.nama,jk:a.jk,tglLahir:a.tgl_lahir,bb:Number(a.bb),sekolah:a.sekolah,kategori:a.kategori,usia:a.usia,kelas:a.kelas,anggota:a.anggota||'',berkas:a.berkas||{}}}
function snap(){
  SNAP={champs:{},regs:{},ath:{},bagan:{}};
  DB.champs.forEach(function(c){SNAP.champs[c.id]=JSON.stringify(champRow(c))});
  DB.regs.forEach(function(r){
    SNAP.regs[r.id]=JSON.stringify(regRow(r));
    r.atlet.forEach(function(a){SNAP.ath[a.id]={j:JSON.stringify(athRow(a,r.id)),rid:r.id}});
  });
  Object.keys(DB.bagan).forEach(function(cid){Object.keys(DB.bagan[cid]).forEach(function(k){SNAP.bagan[cid+'\n'+k]=JSON.stringify(DB.bagan[cid][k])})});
}
async function fetchAll(t,order){
  var out=[],from=0,step=1000;
  for(;;){
    var res=await sb.from(t).select('*').order(order).range(from,from+step-1);
    if(res.error)throw res.error;
    out=out.concat(res.data||[]);
    if(!res.data||res.data.length<step)break;
    from+=step;
  }
  return out;
}
async function loadRemote(){
  var got=await sb.auth.getSession(),ses=got&&got.data&&got.data.session;
  DB.champs=(await fetchAll('championships','tanggal_mulai')).map(champFrom);
  DB.regs=[];DB.bagan={};DB.session=null;
  if(ses){
    var role='peserta',ad=await sb.from('admins').select('user_id').eq('user_id',ses.user.id).maybeSingle();
    if(ad&&ad.data)role='admin';
    DB.session={email:ses.user.email,role:role,uid:ses.user.id};
    var regs=(await fetchAll('registrations','created_at')).map(regFrom),aths=await fetchAll('athletes','created_at'),by={};
    regs.forEach(function(r){by[r.id]=r});
    aths.forEach(function(a){if(by[a.registration_id])by[a.registration_id].atlet.push(athFrom(a))});
    DB.regs=regs;
    if(role==='admin'){
      (await fetchAll('bagan','updated_at')).forEach(function(b){(DB.bagan[b.championship_id]=DB.bagan[b.championship_id]||{})[b.group_key]=b.data});
    }
  }
  normalize(DB);snap();READY=true;
}

function applyServer(r,d){
  if(!d)return;
  if(d.kode_unik!=null)r.bayar.kode=d.kode_unik;
  if(d.kode_kontingen!==undefined)r.kode=d.kode_kontingen||'';
  if(d.user_id)r.userId=d.user_id;
  if(d.email)r.email=d.email;
  if(d.created_at)r.createdAt=Date.parse(d.created_at)||r.createdAt;
}
async function pushAll(){
  var s=DB.session;if(!s)return;
  var adm=s.role==='admin',i,r;
  function ck(res){if(res.error)throw res.error;return res}
  if(adm){
    for(i=0;i<DB.champs.length;i++){
      var c=DB.champs[i],row=champRow(c),j=JSON.stringify(row);
      if(SNAP.champs[c.id]===undefined){ck(await sb.from('championships').insert(row));SNAP.champs[c.id]=j}
      else if(SNAP.champs[c.id]!==j){ck(await sb.from('championships').update(row).eq('id',c.id));SNAP.champs[c.id]=j}
    }
  }
  for(i=0;i<DB.regs.length;i++){
    r=DB.regs[i];
    if(SNAP.regs[r.id]===undefined&&(!r.userId||r.userId===s.uid)){
      var ins=ck(await sb.from('registrations').insert(Object.assign({id:r.id},regRow(r))).select().single());
      applyServer(r,ins.data);SNAP.regs[r.id]=JSON.stringify(regRow(r));
    }
  }
  for(i=0;i<DB.regs.length;i++){
    r=DB.regs[i];
    if(SNAP.regs[r.id]===undefined)continue;
    var up=[],keep={};
    r.atlet.forEach(function(a){
      var ar=athRow(a,r.id),aj=JSON.stringify(ar),sn=SNAP.ath[a.id];keep[a.id]=1;
      if(!sn||sn.j!==aj)up.push({row:ar,j:aj,id:a.id});
    });
    if(up.length){
      ck(await sb.from('athletes').upsert(up.map(function(x){return x.row}),{onConflict:'id'}));
      up.forEach(function(x){SNAP.ath[x.id]={j:x.j,rid:r.id}});
    }
    var rid=r.id,del=Object.keys(SNAP.ath).filter(function(id){return SNAP.ath[id].rid===rid&&!keep[id]});
    if(del.length){ck(await sb.from('athletes').delete().in('id',del));del.forEach(function(id){delete SNAP.ath[id]})}
  }
  for(i=0;i<DB.regs.length;i++){
    r=DB.regs[i];
    var sj=SNAP.regs[r.id];if(sj===undefined)continue;
    var rw=regRow(r);if(JSON.stringify(rw)===sj)continue;
    var payload;
    if(r.userId===s.uid){payload=Object.assign({},rw);delete payload.championship_id;delete payload.catatan}
    else if(adm){payload={status:rw.status,catatan:rw.catatan}}
    else continue;
    var upd=ck(await sb.from('registrations').update(payload).eq('id',r.id).select('kode_kontingen,kode_unik,status').single());
    applyServer(r,upd.data);SNAP.regs[r.id]=JSON.stringify(regRow(r));
  }
  if(adm){
    var seen={},ups=[];
    Object.keys(DB.bagan).forEach(function(cid){Object.keys(DB.bagan[cid]).forEach(function(k){
      var key=cid+'\n'+k,js=JSON.stringify(DB.bagan[cid][k]);seen[key]=1;
      if(SNAP.bagan[key]!==js)ups.push({cid:cid,k:k,key:key,js:js,data:DB.bagan[cid][k]});
    })});
    if(ups.length){
      ck(await sb.from('bagan').upsert(ups.map(function(u){return {championship_id:u.cid,group_key:u.k,data:u.data,updated_at:new Date().toISOString()}}),{onConflict:'championship_id,group_key'}));
      ups.forEach(function(u){SNAP.bagan[u.key]=u.js});
    }
    for(var key2 in SNAP.bagan){
      if(!seen[key2]){var p=key2.split('\n');ck(await sb.from('bagan').delete().eq('championship_id',p[0]).eq('group_key',p.slice(1).join('\n')));delete SNAP.bagan[key2]}
    }
    Object.keys(SNAP.champs).forEach(function(id){if(!DB.champs.some(function(x){return x.id===id}))SNAP.champs[id]='__del__'});
    for(var cid2 in SNAP.champs){
      if(SNAP.champs[cid2]==='__del__'){ck(await sb.from('championships').delete().eq('id',cid2));delete SNAP.champs[cid2]}
    }
  }
}

/* ============ VIEW: WIZARD PENDAFTARAN ============ */
function field(label,name,val,attrs,hint,cls){
  return '<div class="field '+(cls||'')+'"><label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" value="'+esc(val)+'" '+(attrs||'')+'>'+(hint?'<p class="hint">'+hint+'</p>':'')+'</div>';
}
function wizard(id){
  var c=champ(id); if(!c) return notFound();
  pageTitle='Daftar – '+c.nama;
  var s=DB.session;
  if(!isUser(s)){ui.next='/daftar/'+id;go('/masuk');return ''}
  var r=DB.regs.find(function(x){return x.champId===id&&x.email===s.email});
  if(!r){
    if(cStatus(c)!=='buka') return '<section class="sec"><div class="wrap narrow"><h1>Pendaftaran ditutup</h1><p>Kejuaraan ini tidak lagi menerima pendaftaran baru.</p>'+lnk('Lihat kejuaraan lain','#/kejuaraan')+'</div></section>';
    r=newReg(c,s.email);DB.regs.push(r);save();
  }
  var head='<section class="page-head"><div class="wrap"><p><a href="#/kejuaraan/'+c.id+'">← '+esc(c.nama)+'</a></p><h1>Pendaftaran atlet</h1><p>'+fmtRange(c.tanggalMulai,c.tanggalSelesai)+' · '+esc(c.lokasi)+', '+esc(c.kota)+'</p></div></section>';
  if(r.status!=='draft') return head+'<section class="sec"><div class="wrap">'+regStatusView(c,r)+'</div></section>';
  var step=ui.step[r.id]||1;
  var names=['Kontingen','Atlet dan berkas','Formulir','Pembayaran'];
  var stepper='<ol class="stepper">'+names.map(function(n,i){
    var k=i+1;return '<li class="'+(k<step?'done':'')+'"'+(k===step?' aria-current="step"':'')+'>'+n+'</li>';
  }).join('')+'</ol>';
  var body=[stepKontingen,stepAtlet,stepFormulir,stepBayar][step-1](c,r);
  return head+'<section class="sec"><div class="wrap" style="max-width:860px">'+stepper+body+'</div></section>';
}

   field('Nama kontingen','nama',k.nama,'required autocomplete="organization"','Contoh: Perguruan Al Husna Medan')+
   field('Asal daerah atau sekolah','asal',k.asal,'required')+
   field('Nama manajer atau pelatih','manajer',k.manajer,'required autocomplete="name"')+

   '<div class="field span2"><label for="f_email">Email akun</label><input id="f_email" value="'+esc(r.email)+'" readonly></div></div>'+
   '<div class="wiz-nav"><span></span><button class="btn" type="submit"><span>Simpan dan lanjut</span></button></div></form>';

  }).join('')+'</ul><div class="total"><span>Subtotal biaya</span><span>'+rp(subtotal(c,r))+'</span></div>'
  :'<div class="empty" style="margin-bottom:1.2rem">Belum ada atlet. Tambahkan atlet pertama Anda.</div>';

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function groupLabel(g){return g.kategori+' · '+g.usia+' · '+g.jk+(g.kategori==='Tanding'?' · '+g.kelas:'')}
function baganGroups(cid){
  var g={};
  DB.regs.filter(function(r){return r.champId===cid&&r.status==='terverifikasi'}).forEach(function(r){
    r.atlet.forEach(function(a){
      var k=[a.kategori,a.usia,a.jk,a.kelas].join('|');
      if(!g[k])g[k]={key:k,kategori:a.kategori,usia:a.usia,jk:a.jk,kelas:a.kelas,items:[]};
      g[k].items.push({nama:a.nama,kontingen:r.kontingen.nama,anggota:a.anggota||''});
    });
  });
  return Object.keys(g).map(function(k){return g[k]}).sort(function(x,y){
    return ALL_KAT.indexOf(x.kategori)-ALL_KAT.indexOf(y.kategori)||ALL_USIA.indexOf(x.usia)-ALL_USIA.indexOf(y.usia)||x.jk.localeCompare(y.jk)||x.kelas.localeCompare(y.kelas,'id',{numeric:true});
  });
}
function drawGroup(g){
  var items=g.items.slice(),n=items.length,out={n:n,at:Date.now()};
  if(g.kategori!=='Tanding'){out.type='urutan';out.order=shuffle(items);return out}
  if(n<2){out.type='solo';out.order=items;return out}
  var size=1;while(size<n)size*=2;
  var M=size/2,byes=size-n,idx=[],isBye={},i;
  for(i=0;i<M;i++)idx.push(i%2===0?i/2:M-1-(i-1)/2);
  idx.slice(0,byes).forEach(function(m){isBye[m]=true});
  var best=null,bestScore=1e9;
  for(var t=0;t<300&&bestScore>0;t++){
    var sh=shuffle(items.slice()),p=0,ms=[],score=0;
    for(var m=0;m<M;m++){
      if(isBye[m]){ms.push([sh[p++],null])}
      else{var a=sh[p++],b=sh[p++];ms.push([a,b]);if(a.kontingen.trim().toLowerCase()===b.kontingen.trim().toLowerCase())score++}
    }
    if(score<bestScore){bestScore=score;best=ms}
  }
  out.type='bracket';out.size=size;out.first=best;out.konflik=bestScore;
  return out;
}
function bracketRounds(b){
  var num=0,r1=b.first.map(function(m){var bye=!m[1];return {a:m[0],b:m[1],bye:bye,no:bye?0:++num}});
  var rounds=[r1],prev=r1;
  while(prev.length>1){
    var cur=[];
    for(var i=0;i<prev.length;i+=2)cur.push({srcA:prev[i],srcB:prev[i+1],no:++num});
    rounds.push(cur);prev=cur;
  }
  return rounds;
}
function slotOf(src){return src.bye?{n:src.a.nama,k:src.a.kontingen}:{n:'Pemenang partai '+src.no,k:'',ph:true}}
function sides(m,ri){
  if(ri===0)return m.bye?[{n:m.a.nama,k:m.a.kontingen},{n:'Bye',k:'',ph:true}]:[{n:m.a.nama,k:m.a.kontingen},{n:m.b.nama,k:m.b.kontingen}];
  return [slotOf(m.srcA),slotOf(m.srcB)];
}
function roundName(len,i){return len===1?'Final':len===2?'Semifinal':len===4?'Perempat final':'Babak '+(i+1)}
function renderBracket(b){
  return '<div class="bracket">'+bracketRounds(b).map(function(r,ri){
    return '<div class="round"><h4>'+roundName(r.length,ri)+'</h4><div class="rm">'+r.map(function(m){
      var s=sides(m,ri),lab=(ri===0&&m.bye)?'Lolos otomatis':'Partai '+m.no;
      return '<div class="match"><div class="no">'+lab+'</div>'+s.map(function(x){return '<div'+(x.ph?' class="bye"':'')+'>'+esc(x.n)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>'}).join('')+'</div>';
    }).join('')+'</div></div>';
  }).join('')+'</div>';
}

function exportBagan(cid){
  var rows=[['Kelompok','Partai / urutan','Atlet A','Kontingen A','Atlet B','Kontingen B']],any=false;
  baganGroups(cid).forEach(function(g){
    var b=(DB.bagan[cid]||{})[g.key];if(!b)return;any=true;var L=groupLabel(g);
    if(b.type==='bracket')bracketRounds(b).forEach(function(r,ri){r.forEach(function(m){var s=sides(m,ri);rows.push([L,(ri===0&&m.bye)?'Lolos otomatis':'Partai '+m.no,s[0].n,s[0].k,s[1].n,s[1].k])})});
    else b.order.forEach(function(x,i){rows.push([L,'Urutan '+(i+1),x.nama,x.kontingen,'',''])});
  });
  if(!any){toast('Belum ada bagan yang diundi.',true);return}
  saveCSV(rows,'bagan-ahpro-'+isoDay(new Date())+'.csv');
}
async function saveCSV(rows,name){
  var csv='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:csv});return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('Unduhan tidak tersedia di tampilan ini.',true)}
}

function calc(f,src){
  var c=champ(reg(f.dataset.rid).champId);
  var kat=f.kategori.value,usia=f.usia.value,bb=parseFloat(f.bb.value);
  var isT=kat==='Tanding';
  $('#kelasWrap',f).hidden=!isT;
  $('#anggotaWrap',f).hidden=!(kat==='Ganda'||kat==='Regu');
  $('#katHint',f).textContent=KAT_UNIT[kat]?'Biaya '+rp(c.fees[kat])+' '+KAT_UNIT[kat]+'.':'';
  var sel=f.kelas,prev=sel.value||sel.dataset.initial||'';
  var jk=(f.querySelector('input[name=jk]:checked')||{}).value||'';
  var opts=jk?kelasOptions(c,usia,jk):[],sug='';
  if(bb>0)opts.forEach(function(o){if(!sug&&bb>=o.a&&(o.b==null||bb<=o.b))sug=o.v});
  sel.innerHTML=opts.length?opts.map(function(o){return '<option>'+esc(o.v)+'</option>'}).join(''):'<option value="">'+(jk?'Belum ada kelas untuk pilihan ini':'Pilih jenis kelamin dulu')+'</option>';
  var has=opts.some(function(o){return o.v===prev});
  if((src==='bb'||src==='usia'||src==='jk')&&sug)sel.value=sug;
  else if(has)sel.value=prev;

var CRCT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],central=[],offset=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    var c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,offset,true);
    central.push(new Uint8Array(c.buffer),nm);
    offset+=30+nm.length+sz;
  });
  var csz=0;central.forEach(function(x){csz+=x.length});
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,offset,true);
  var all=parts.concat(central,[new Uint8Array(e.buffer)]),tot=0;all.forEach(function(x){tot+=x.length});
  var out=new Uint8Array(tot),p=0;all.forEach(function(x){out.set(x,p);p+=x.length});
  return out;
}
function xe(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function colName(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
/* gaya: 0 biasa, 1 judul, 2 header, 3 sel teks, 4 sel tengah, 5 baris kelompok, 6 catatan */
function sheetXml(sh){
  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">'+
    (sh.freeze?'<pane ySplit="'+sh.freeze+'" topLeftCell="A'+(sh.freeze+1)+'" activePane="bottomLeft" state="frozen"/>':'')+'</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
  x+='<cols>'+sh.widths.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'}).join('')+'</cols><sheetData>';
  sh.rows.forEach(function(row,ri){
    x+='<row r="'+(ri+1)+'">';
    row.forEach(function(cell,ci){
      if(cell==null)return;
      var v=typeof cell==='object'?cell.v:cell,s=typeof cell==='object'&&cell.s?cell.s:0,ref=colName(ci)+(ri+1);
      if(v===''||v==null)x+='<c r="'+ref+'" s="'+s+'"/>';
      else if(typeof v==='number'&&isFinite(v))x+='<c r="'+ref+'" s="'+s+'"><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  x+='</sheetData>';
  if(sh.merges&&sh.merges.length)x+='<mergeCells count="'+sh.merges.length+'">'+sh.merges.map(function(m){return '<mergeCell ref="'+m+'"/>'}).join('')+'</mergeCells>';
  return x+'<pageSetup orientation="landscape"/></worksheet>';
}
var XSTYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
 '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF666666"/><name val="Calibri"/></font></fonts>'+
 '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2B600"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAEAEA"/><bgColor indexed="64"/></patternFill></fill></fills>'+
 '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFB0B0B0"/></left><right style="thin"><color rgb="FFB0B0B0"/></right><top style="thin"><color rgb="FFB0B0B0"/></top><bottom style="thin"><color rgb="FFB0B0B0"/></bottom><diagonal/></border></borders>'+
 '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
 '<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
 '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
 '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
 '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
 '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>'+
 '<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>'+
 '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'+
 '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
function buildXlsx(sheets){
  var enc=new TextEncoder(),names=[],used={};
  sheets.forEach(function(sh){
    var n=sh.name.replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Sheet',b=n,k=2;
    while(used[n.toLowerCase()]){n=b.slice(0,28)+' '+k++}
    used[n.toLowerCase()]=1;names.push(n);
  });
  var files=[
   {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'}).join('')+'</Types>'},
   {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+names.map(function(n,i){return '<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join('')+'</sheets></workbook>'},
   {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
   {name:'xl/styles.xml',data:XSTYLES}
  ];
  sheets.forEach(function(s,i){files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s)})});
  files.forEach(function(f){if(typeof f.data==='string')f.data=enc.encode(f.data)});
  return zipStore(files);
}

/* ---- kode kontingen: K001, K002, ... urut berdasarkan waktu pendaftaran per kejuaraan ---- */
function ensureKode(cid){
  if(REMOTE)return;
  var max=0,ch=false;
  DB.regs.forEach(function(r){if(r.champId===cid&&r.kode){var n=parseInt(String(r.kode).replace(/\D/g,''),10);if(n>max)max=n}});
  DB.regs.filter(function(r){return r.champId===cid&&r.status!=='draft'&&!r.kode}).sort(function(a,b){return a.createdAt-b.createdAt}).forEach(function(r){
    max++;r.kode='K'+String(max).padStart(3,'0');ch=true;
  });
  if(ch)save();
}
function ageHeader(){return ['No','Nama Kontingen','Kode Kontingen','Nama Peserta','Jenis Kelamin','Kategori','Kelas','Tanggal Lahir','Berat (kg)','Asal Sekolah / Perguruan','Anggota Lain (Ganda/Regu)','Status'].map(function(h){return {v:h,s:2}})}
function usiaSheet(c,u,items){
  var cols=12,rows=[],merges=[];
  rows.push([{v:'Daftar Atlet – '+c.nama,s:1}]);
  rows.push([{v:u+' · '+fmtRange(c.tanggalMulai,c.tanggalSelesai)+' · '+c.lokasi+', '+c.kota+' · diunduh '+fmtD(isoDay(new Date())),s:6}]);
  rows.push([]);
  rows.push(ageHeader());
  var hr=4;
  if(!items.length){
    rows.push([{v:'Belum ada atlet pada kelompok usia ini.',s:6}]);
  } else {
    var groups={};
    items.forEach(function(x){
      var k=[x.a.kategori,x.a.jk,x.a.kelas].join('|');
      (groups[k]=groups[k]||{kat:x.a.kategori,jk:x.a.jk,kelas:x.a.kelas,list:[]}).list.push(x);
    });
    function kidx(g){var l=kelasOptions(c,u,g.jk).map(function(o){return o.v});var i=l.indexOf(g.kelas);return i<0?999:i}
    Object.keys(groups).map(function(k){return groups[k]}).sort(function(x,y){
      return ALL_KAT.indexOf(x.kat)-ALL_KAT.indexOf(y.kat)||x.jk.localeCompare(y.jk)||kidx(x)-kidx(y)||x.kelas.localeCompare(y.kelas,'id',{numeric:true});
    }).forEach(function(g){
      var label=g.kat+' · '+g.jk+(g.kat==='Tanding'?' · '+g.kelas:'')+' ('+g.list.length+' atlet)';
      var gr=[{v:label,s:5}];for(var i=1;i<cols;i++)gr.push({v:'',s:5});
      rows.push(gr);merges.push('A'+rows.length+':'+colName(cols-1)+rows.length);
      g.list.sort(function(x,y){return x.r.kontingen.nama.localeCompare(y.r.kontingen.nama,'id')||x.a.nama.localeCompare(y.a.nama,'id')}).forEach(function(x,i){
        var a=x.a;
        rows.push([{v:i+1,s:4},{v:x.r.kontingen.nama,s:3},{v:x.r.kode||'',s:4},{v:a.nama,s:3},{v:a.jk,s:3},{v:a.kategori,s:3},{v:a.kelas,s:3},{v:a.tglLahir?a.tglLahir.split('-').reverse().join('-'):'',s:4},{v:a.bb,s:4},{v:a.sekolah,s:3},{v:(a.anggota||'').replace(/\n/g,'; '),s:3},{v:REG_STATUS[x.r.status],s:3}]);
      });
    });
  }
  return {name:u,rows:rows,merges:merges,freeze:hr,widths:[5,28,11,26,12,11,26,13,10,28,28,20]};
}
function rekapSheet(c,regs){
  var rows=[[{v:'Rekap Kontingen – '+c.nama,s:1}],[{v:'Diunduh '+fmtD(isoDay(new Date())),s:6}],[],
    ['No','Kode Kontingen','Nama Kontingen','Asal Daerah / Sekolah','Manajer / Pelatih','WhatsApp','Email','Jumlah Atlet','Total Biaya (Rp)','Status'].map(function(h){return {v:h,s:2}})];
  regs.slice().sort(function(a,b){return String(a.kode).localeCompare(String(b.kode))}).forEach(function(r,i){
    rows.push([{v:i+1,s:4},{v:r.kode,s:4},{v:r.kontingen.nama,s:3},{v:r.kontingen.asal,s:3},{v:r.kontingen.manajer,s:3},{v:r.kontingen.hp,s:3},{v:r.email,s:3},{v:r.atlet.length,s:4},{v:total(c,r),s:3},{v:REG_STATUS[r.status],s:3}]);
  });
  return {name:'Rekap Kontingen',rows:rows,merges:[],freeze:4,widths:[5,11,28,26,24,16,28,12,16,20]};
}
function exportExcel(){
  var cid=ui.regChamp;
  if(!cid||!champ(cid)){toast('Pilih satu kejuaraan pada filter "Kejuaraan" dulu.',true);return}
  var c=champ(cid);ensureKode(cid);
  var allowed=ui.regStatus?[ui.regStatus]:['terverifikasi','menunggu_verifikasi'];
  var regs=DB.regs.filter(function(r){return r.champId===cid&&allowed.indexOf(r.status)>-1});
  if(!regs.length){toast('Belum ada pendaftaran yang cocok untuk diunduh.',true);return}
  var items=[];regs.forEach(function(r){r.atlet.forEach(function(a){items.push({r:r,a:a})})});
  var usia=c.kelompokUsia.slice();
  items.forEach(function(x){if(usia.indexOf(x.a.usia)<0)usia.push(x.a.usia)});
  usia.sort(function(a,b){var i=ALL_USIA.indexOf(a),j=ALL_USIA.indexOf(b);return (i<0?99:i)-(j<0?99:j)});
  var sheets=usia.map(function(u){return usiaSheet(c,u,items.filter(function(x){return x.a.usia===u}))});
  sheets.push(rekapSheet(c,regs));
  var slug=c.nama.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'kejuaraan';
  saveBinary(buildXlsx(sheets),'atlet-'+slug+'-'+isoDay(new Date())+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
async function saveBinary(bytes,name,mime){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:new Blob([bytes],{type:mime})});return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('Unduhan tidak tersedia di tampilan ini.',true)}
}

async function exportCSV(){
  var rows=[['Kejuaraan','Kontingen','Asal','Manajer','WhatsApp','Email','Atlet','Jenis kelamin','Tanggal lahir','Berat (kg)','Sekolah/perguruan','Kategori','Kelompok usia','Kelas','Anggota lain','Status pendaftaran']];
  filteredRegs().forEach(function(r){
    var c=champ(r.champId);
    r.atlet.forEach(function(a){rows.push([c?c.nama:'',r.kontingen.nama,r.kontingen.asal,r.kontingen.manajer,r.kontingen.hp,r.email,a.nama,a.jk,a.tglLahir,a.bb,a.sekolah,a.kategori,a.usia,a.kelas,(a.anggota||'').replace(/\n/g,'; '),REG_STATUS[r.status]])});
  });
  if(rows.length===1){toast('Tidak ada data untuk diunduh.',true);return}
  var csv='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var name='pendaftaran-ahpro-'+isoDay(new Date())+'.csv';
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:csv});return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('Unduhan tidak tersedia di tampilan ini.',true)}
}

  if(full){window.scrollTo(0,0);main.focus({preventScroll:true})}
}
function rerender(){var y=window.scrollY;var open=dlg.open;if(open)dlg.close();render(false);window.scrollTo(0,y)}
window.addEventListener('hashchange',function(){render(true)});

/* ============ INIT ============ */
try{var th=localStorage.getItem('ahpro:theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
$$('img[data-logo]').forEach(function(i){i.src=LOGO});
if(CONFIGURED&&!REMOTE){
  main.innerHTML='<section class="sec"><div class="wrap narrow"><h1>Layanan belum bisa dimuat</h1><p>Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</p></div></section>';
  renderHeader();
}else if(REMOTE){
  main.innerHTML='<section class="sec"><div class="wrap"><p>Memuat data…</p></div></section>';
  loadRemote().then(function(){render(false)},function(e){
    main.innerHTML='<section class="sec"><div class="wrap narrow"><h1>Tidak bisa terhubung</h1><p>'+esc(errMsg(e))+'</p><p>Muat ulang halaman, atau hubungi panitia bila masalah berlanjut.</p></div></section>';
  });
}else render(false);
})();
</script>
</body>
</html>
